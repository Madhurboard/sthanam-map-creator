# Render Blueprint for the Sthanam backend.
# Render → New → Blueprint → point at this repo. Secrets are marked sync:false,
# so Render prompts for them instead of reading them from this file.

services:
  - type: web
    name: sthanam-backend
    runtime: node
    plan: free
    # Closest Render region to Indian traffic.
    region: singapore
    branch: main
    # Built from the repo root so npm workspaces resolves the backend's deps.
    buildCommand: npm ci && npm run build:backend
    startCommand: npm run start --workspace=backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT; index.ts already reads it.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Comma-separated. Must include the Vercel production domain, and any
      # preview domain you want to test payments from.
      - key: FRONTEND_URL
        sync: false
