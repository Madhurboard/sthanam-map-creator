# Render Blueprint for the Sthanam backend.
# Mirrors the manual service settings — keep the two in step.

services:
  - type: web
    name: sthanam-backend
    runtime: node
    plan: free
    # Singapore is the closest Render region to Indian traffic.
    region: singapore
    branch: main
    # Built from backend/ rather than the repo root: this installs only the
    # API's 113 packages instead of the whole frontend tree, which matters on
    # a 512MB instance, and stops frontend-only commits triggering a rebuild.
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Render injects PORT; index.ts already reads it.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Set to the literal word "placeholder" until Razorpay KYC clears: the
      # service then boots with a warning and serves the free tier.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Comma-separated CORS allowlist. Must include the Vercel domain.
      - key: FRONTEND_URL
        sync: false
